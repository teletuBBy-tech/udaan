@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--forest:#174d38;--green:#26724f;--mint:#e7f3e9;--cream:#faf8f1;--paper:#fffefa;--ink:#1e3028;--muted:#69766d;--line:#e4e8df;--saffron:#f4c65e;--blue:#e8f1fb;--shadow:0 8px 28px #193d2810;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Hind','Inter',sans-serif;font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d69f20;outline-offset:3px}.app{max-width:1220px;margin:auto;min-height:100vh}.topbar{height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:23px;color:var(--forest)}.logo{height:42px;width:42px;border-radius:14px;background:var(--forest);color:white;display:grid;place-items:center;font-size:24px}.top-actions{display:flex;align-items:center;gap:10px}.status{font-size:13px;color:var(--muted);background:#f0f2eb;padding:8px 12px;border-radius:30px}.profile-pill{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:30px;color:var(--forest);font-weight:600}.main{padding:28px 28px 110px}.welcome{display:grid;grid-template-columns:1.4fr .6fr;gap:24px;background:var(--forest);color:white;border-radius:26px;padding:30px 34px;overflow:hidden;position:relative}.eyebrow{font-size:13px;letter-spacing:.04em;opacity:.82}.welcome h1{font-size:clamp(28px,4vw,43px);line-height:1.2;margin:8px 0 10px}.welcome p{font-size:17px;line-height:1.55;max-width:600px;color:#e3eee5;margin:0 0 22px}.hero-art{display:grid;place-items:center;font-size:100px;position:relative}.hero-art:before,.hero-art:after{content:'';position:absolute;border:1px solid #ffffff30;border-radius:50%;width:220px;height:220px}.hero-art:after{width:165px;height:165px}.hero-art span{z-index:1;filter:drop-s ow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.chip{padding:8px 13px;border:1px solid var(--line);border-radius:30px;background:white;color:var(--muted);font-weight:600}.chip.active{background:var(--forest);color:white;border-color:var(--forest)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:600;font-size:14px}.field input,.field textarea,.field select{width:100%;border:1px solid #d9e0d6;border-radius:12px;padding:12px 13px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:120px}.talk-layout{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px}.mic-panel{text-align:center;padding:28px}.mic-button{width:112px;height:112px;border:0;border-radius:50%;background:var(--forest);color:white;font-size:40px;box-shadow:0 0 0 12px var(--mint);margin:22px auto 25px;display:grid;place-items:center}.mic-button.recording{background:#b83e34;animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 20px #f8dfdc}}.map-wrap{background:#eaf1e4;border-radius:18px;overflow:hidden;border:1px solid #d7e2d2;position:relative}.map-svg{width:100%;height:auto;display:block;min-height:260px}.map-legend{position:absolute;left:12px;top:12px;background:#ffffffed;padding:10px 12px;border-radius:12px;font-size:12px;box-shadow:var(--shadow)}.map-pin{cursor:pointer}.map-pin circle{stroke:white;stroke-width:3}.map-pin:focus{outline:none}.map-pin:focus circle{stroke:#f4c65e;stroke-width:6}.map-details{margin-top:14px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filter-row select{border:1px solid var(--line);border-radius:12px;background:white;padding:9px 12px}.step{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.step-number{height:34px;width:34px;flex-shrink:0;border-radius:50%;background:var(--mint);color:var(--forest);font-weight:800;display:grid;place-items:center}.step.done .step-number{background:var(--forest);color:white}.step h4{margin:0 0 4px}.step p{margin:0;font-size:14px}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1220px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fffefaF5;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}.nav-item{border:0;background:transparent;color:#738077;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:12px;font-weight:700;border-radius:12px}.nav-item .nav-icon{font-size:22px;line-height:1.2}.nav-item.active{color:var(--forest);background:var(--mint)}.notice{padding:12px 14px;border-radius:12px;background:#fff5d8;color:#71591c;font-size:13px;line-height:1.5}.success{background:#e7f3e9;color:#245a3c}.divider{height:1px;background:var(--line);margin:18px 0}.empty{padding:26px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#12271db0;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:var(--paper);border-radius:22px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source{font-size:12px;color:var(--muted);margin-top:8px}.footer-note{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#183d2c;color:white;border-radius:12px;padding:12px 18px;z-index:30;box-shadow:var(--shadow);max-width:90vw}.small-label{font-size:12px;color:var(--muted)}.checkline{display:flex;align-items:center;gap:9px;margin:10px 0}.checkline input{width:18px;height:18px;accent-color:var(--forest)}
@media(max-width:760px){.topbar{height:64px;padding:0 15px}.brand{font-size:20px}.main{padding:16px 14px 108px}.welcome{grid-template-columns:1fr;padding:24px 22px}.hero-art{display:none}.welcome h1{font-size:30px}.grid-3,.grid-2,.talk-layout{grid-template-columns:1fr}.section-head{margin-top:24px}.card{padding:17px}.status{display:none}.map-svg{min-height:220px}.two-col{grid-template-columns:1fr}.bottom-nav{padding-left:4px;padding-right:4px}.nav-item{font-size:11px}.nav-item .nav-icon{font-size:21px}.career-card{gap:11px}.career-emoji{width:48px;height:48px;font-size:26px}}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="logo">✦</div><span>उड़ान <span style="font-size:12px;font-weight:500;color:var(--muted)">LEARN • GROW • EARN</span></span></div><div class="top-actions"><button id="languageToggle" class="profile-pill" type="button" aria-label="Switch language">English</button><span id="connectionStatus" class="status">● डिवाइस पर सेव</span><button class="profile-pill" id="profileButton" aria-label="प्रोफ़ाइल और सेटिंग्स">🙂 <span id="profileName">मेरा प्रोफ़ाइल</span></button></div></header><main class="main" id="main" aria-live="polite"></main><nav class="bottom-nav" aria-label="मुख्य नेविगेशन"><button class="nav-item active" data-tab="talk"><span class="nav-icon">🎙️</span><span>बात करें</span></button><button class="nav-item" data-tab="learn"><span class="nav-icon">🌱</span><span>सीखें</span></button><button class="nav-item" data-tab="chances"><span class="nav-icon">📍</span><span>मौके</span></button><button class="nav-item" data-tab="teacher"><span class="nav-icon">📚</span><span>शिक्षक</span></button><button class="nav-item" data-tab="family"><span class="nav-icon">🏡</span><span>परिवार</span></button></nav></div><div id="modalRoot"></div><div id="toastRoot"></div><script src="/app.js" defer></script></body></html>
